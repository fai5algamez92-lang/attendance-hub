<style>
:root{--b:#0a7cff;--bd:#0059c9;--bg:#f1f3f7;--cd:#fff;--tx:#1b2430;--mu:#7a8594;--in:#e9ecf1;--er:#d93025;--ok:#18a058}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",Roboto,"Noto Nastaliq Urdu",sans-serif;overscroll-behavior-y:contain;user-select:none;-webkit-user-select:none;padding-top:env(safe-area-inset-top,0px)}
input,select{user-select:text;-webkit-user-select:text}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pg{max-width:520px;margin:0 auto;padding:16px 16px 100px;animation:f .25s ease both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sp{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:10px;background:linear-gradient(#0a84f5,#0059c9);color:#fff}.lg{border-radius:18px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.hd h2,.hd h3{margin:0}.mu{color:var(--mu);font-size:13px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.btn{flex:1}
.card{background:var(--cd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #1b24300d}
button.big{display:block;width:100%;text-align:start;border:0;font:inherit;color:var(--tx);cursor:pointer}button.big:active{transform:scale(.98)}
.big h3{margin:0;color:var(--b)}.big p{margin:2px 0 0;color:var(--mu);font-size:13px}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;background:#fff}.chip.on{color:var(--ok)}.chip.off{color:#d98324}
.ib{border:0;background:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--tx);cursor:pointer;font-size:18px}
.bn{background:#fff3d6;color:#7a5500;border-radius:12px;padding:8px 12px;font-size:13px}
.f{margin-top:12px}.lb{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:0;background:var(--in);color:var(--tx);outline-color:var(--b)}
.pw{position:relative}.pw input{padding-inline-end:46px}.eye{position:absolute;inset-inline-end:6px;top:4px;border:0;background:none;color:var(--mu);width:38px;height:38px;display:grid;place-items:center}
.ckg{display:grid;gap:6px}.ck{display:flex;gap:10px;align-items:center;background:var(--in);border-radius:12px;padding:8px 12px}.ck input{width:auto}
.sec{margin-top:14px;padding-top:6px;border-top:1px dashed #cfd5df}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;background:var(--b);color:#fff;cursor:pointer;margin-top:14px;width:100%}.btn:disabled{opacity:.7}
.btn.o{background:transparent;color:var(--b);border:1.5px solid var(--b)}.btn.w{background:#fff;color:var(--b)}.ok .btn.o{color:#fff;border-color:#fff}
.er{color:var(--er);font-size:13px;margin:8px 0 0}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}
.au{max-width:420px;margin:0 auto;padding:40px 24px}.au h1{font-weight:300;font-size:28px;line-height:1.2;margin:18px 0 4px}.au h1 b{display:block;font-weight:700}.bl{color:var(--b);font-size:13px;margin:0 0 6px}
.au a{color:var(--b);cursor:pointer}.c{text-align:center;font-size:13px;color:var(--mu)}.bt{margin-top:40px}
.rm{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}.rm input{width:auto}
.ok{position:fixed;inset:0;padding:70px 28px 100px;background:linear-gradient(#0a84f5,#0059c9);color:#fff}.ok h1{margin:12px 0 6px}.ok p{opacity:.9}.tick{width:64px;height:64px;border-radius:50%;background:#ffffff30;display:grid;place-items:center;font-size:30px}.ok .col{position:absolute;left:28px;right:28px;bottom:100px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #e3e7ee;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;display:grid;justify-items:center;gap:2px;padding:6px 0;position:relative}
nav button.on{color:var(--b)}nav button.on:before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--b)}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f4}.li:last-child{border:0}
.st{font-size:12px;border-radius:8px;padding:1px 9px;background:#ffe9bf;color:#7a5500}.st.s,.st.approved{background:#c9f0dc;color:#0b5a32}.st.blocked{background:#fbd4d0;color:#8a1c12}
.sm{border:0;border-radius:9px;background:var(--b);color:#fff;padding:3px 12px;font:inherit;font-size:13px}.sm.r{background:var(--er)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chb{border:1.5px solid var(--in);background:var(--in);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;color:var(--tx)}.chb.on{background:var(--b);color:#fff;border-color:var(--b)}
#qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:14px;margin-top:12px;min-height:60px}video{width:100%;border-radius:14px;background:#000}

<div class="f"><span class="lb">Email</span><input name="e" type="email" autocapitalize="off" required placeholder="Your email" value="${esc(S.em)}"></div>
<div class="f"><span class="lb">Password</span><div class="pw"><input name="p" id="pw" type="password" required placeholder="Your password"><button type="button" class="eye" onclick="eye()">${I.eye}</button></div></div>
${r?"":`<label class="rm"><input type="checkbox" name="r" checked> Remember me</label>`}
<button class="btn">${r?"Create account":"Login"}</button><p class="er">${esc(S.msg)}</p></form>
${r?"":`<p class="c"><a onclick="alert('Please contact the admin to reset your password.')">Forgot your password?</a></p>`}
<p class="c bt">${r?"Already have an account?":"Don't have an account yet?"} <a onclick="S.mode='${r?"login":"reg"}';S.msg='';draw()">${r?"Login":"Create one"}</a></p></div>`}
function eye(){const p=$("#pw"),s=p.type==="password";p.type=s?"text":"password";$(".eye").innerHTML=s?I.eo:I.eye}
async function au(ev){ev.preventDefault();if(S.busy)return;const f=new FormData(ev.target),r=S.mode==="reg",e=f.get("e").trim().toLowerCase();
S.em=e;S.nm=f.get("n")||"";S.busy=1;const b=ev.target.querySelector(".btn");b.disabled=true;b.innerHTML='<span class="spin"></span> Please wait…';
const x=await api(r?"register":"login",{e,p:f.get("p"),n:f.get("n")}).catch(()=>({err:"Could not connect. Please check your internet."}));S.busy=0;
if(!x.ok){S.msg=x.err;return draw()}
if(r){S.mode="login";S.msg="Request sent. You can log in after the admin approves you.";return draw()}
S.u={...x.u,tk:x.tk};W("me",S.u);W("rem",!!f.get("r"));try{sessionStorage.setItem("ses","1")}catch(z){}go("home");loadCfg()}
function home(){const n=q().filter(x=>x.s==="p").length;
return `<div class="hd"><div><p class="mu">Welcome back</p><h2>${esc(S.u.name)}</h2></div><div class="row"><span class="chip ${navigator.onLine?"on":"off"}">${navigator.onLine?"Online":"Offline"}</span><button class="ib" onclick="out()">${I.out}</button></div></div>
${n?`<div class="bn">${n} ${n>1?"entries are":"entry is"} waiting to sync</div>`:""}
${CF?Object.entries(CF).map(([k,f])=>`<button class="card big" onclick="go('form',{f:'${k}',pre:{}})"><h3 dir="auto">${esc(f.title)}</h3><p>Fill and submit</p></button>`).join(""):`<div class="card"><p class="mu">${navigator.onLine?"Loading forms…":"Connect to the internet once to load the forms."}</p></div>`}
${CF?`<button class="card big" onclick="go('qrc')"><h3>Create QR</h3><p>Prefill the seminar registration</p></button>`:""}`}
const cap=()=>{const f=$("form");if(!f)return;const d=new FormData(f);for(const k of new Set([...d.keys()])){const a=d.getAll(k);S.pre[k]=a.length>1?a:a[0]}};
function fh(d,Q){const v=Q[d.k]??"";let h=`<div class="f"><span class="lb" dir="auto">${esc(d.l)}${d.req?" *":""}</span>`;
if(d.t==="multi")h+=`<div class="ckg">${d.o.map(o=>`<label class="ck"><input type="checkbox" name="${d.k}" value="${esc(o)}" ${[].concat(v).includes(o)?"checked":""}><span dir="auto">${esc(o)}</span></label>`).join("")}</div>`;
else if(d.t==="choice")h+=`<select name="${d.k}" dir="auto" ${d.req?"required":""} ${d.br?'onchange="cap();draw()"':""}><option value="">Select…</option>${d.o.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
else h+=`<input name="${d.k}" dir="auto" type="${{dt:"datetime-local",date:"date",time:"time",tel:"tel"}[d.t]||"text"}" ${d.t==="tel"?'inputmode="numeric"':""} value="${esc(v)}" ${d.req?"required":""}>`;
return h+"</div>"}
function form(){const f=CF[S.f],Q=S.pre,bf=f.fields.find(x=>x.br),s=bf&&f.sections?.[Q[bf.k]];
return `<div class="hd"><button class="ib" onclick="go('home')">${I.back}</button><h3 dir="auto">${esc(f.title)}</h3><span style="width:40px"></span></div>
<form class="card" onsubmit="return sub(event)">${f.fields.map(d=>fh(d,Q)).join("")}${bf&&Q[bf.k]?`<div class="sec">${s&&s.length?s.map(d=>fh(d,Q)).join(""):'<p class="mu">No questions found for this section.</p>'}</div>`:""}<button class="btn">Submit</button><p class="er">${esc(S.msg)}</p></form>`}
function sub(ev){ev.preventDefault();const f=new FormData(ev.target),d={},F=CF[S.f];for(const k of new Set([...f.keys()])){const a=f.getAll(k);d[k]=a.length>1?a:a[0]}
const tel=F.fields.find(x=>x.t==="tel");if(tel&&!/^\d{11}$/.test(String(d[tel.k]||"").replace(/\D/g,""))){S.msg="Mobile number must be 11 digits";draw();return false}
const bf=F.fields.find(x=>x.br),pg=bf&&F.pages?.[d[bf.k]],a=q();
a.unshift({id:Date.now().toString(36),f:S.f,d,pg,s:"p",ts:new Date().toLocaleString("en-GB")});W("q",a);go("done");sync();return false}
const done=()=>`<div class="ok"><div class="tick">✔</div><h1>Saved!</h1><p>${navigator.onLine?"Your entry is being sent.":"You are offline. It will sync automatically when you are online."}</p><div class="col"><button class="btn w" onclick="go('form',{f:'${S.f}',pre:{}})">Submit another</button><button class="btn o" onclick="go('home')">Back</button></div></div>`;
function hist(){const a=q().slice(0,100);return `<div class="hd"><h2>History</h2></div><div class="card">${a.map(x=>`<div class="li"><div><b dir="auto">${esc(CF?.[x.f]?.title||x.f)}</b><br><span class="mu">${esc(x.ts)}</span></div><span class="st ${x.s}">${x.s==="s"?"Synced":"Pending"}</span></div>`).join("")||'<p class="mu">No entries yet</p>'}</div>`}
/* ===== sync (form ke submit link par) ===== */
const mark=id=>{const a=q(),i=a.find(x=>x.id===id);if(i){i.s="s";W("q",a)}};
async function sync(){if(!navigator.onLine||sy||!CF)return;sy=1;let ch=0;
try{for(const it of q().filter(x=>x.s==="p")){const f=CF[it.f];if(!f)continue;const b=new URLSearchParams(),Z=(fd,n)=>n.forEach(([k,x])=>b.append(fd.e+"_"+k,x));
for(const fd of [...f.fields,...Object.values(f.sections||{}).flat()]){const v=it.d[fd.k];if(v==null||v==="")continue;
if(fd.t==="dt"){const[d,t]=v.split("T"),[y,m,dd]=d.split("-"),[h,mi]=t.split(":");Z(fd,[["year",y],["month",m],["day",dd],["hour",h],["minute",mi]])}
else if(fd.t==="date"){const[y,m,dd]=v.split("-");Z(fd,[["year",y],["month",m],["day",dd]])}
else if(fd.t==="time"){const[h,mi]=v.split(":");Z(fd,[["hour",h],["minute",mi]])}
else[].concat(v).forEach(x=>b.append(fd.e,x))}
if(it.pg)b.append("pageHistory","0,"+it.pg);
await fetch(f.action,{method:"POST",mode:"no-cors",body:b});mark(it.id);ch=1}}catch(e){}
sy=0;if(ch)soft()}
/* ===== QR ===== */
function qrc(){const st=CF.seminar.fields[3]?.o||[];return `<div class="hd"><button class="ib" onclick="go('home')">${I.back}</button><h3>Create QR</h3><span style="width:40px"></span></div><div class="card"><p class="mu">Seminar registration prefill</p>
<div class="f"><span class="lb">Name</span><input id="q1" oninput="mk()"></div><div class="f"><span class="lb">Mobile number</span><input id="q2" type="tel" inputmode="numeric" oninput="mk()"></div>
<div class="f"><span class="lb">Reference</span><input id="q3" oninput="mk()"></div><div class="f"><span class="lb">Training status</span><select id="q4" dir="auto" onchange="mk()"><option value="">—</option>${st.map(o=>`<option>${esc(o)}</option>`).join("")}</select></div>
<div id="qr"></div><div class="row"><button class="btn" onclick="qsave()">Save image</button><button class="btn o" onclick="qshare()">Share</button></div></div>`}
function mk(){const g=i=>$("#"+i)?.value.trim()||"",b=$("#qr");if(!b)return;b.innerHTML="";const o={f:"seminar",n:g("q1"),m:g("q2"),ref:g("q3"),st:g("q4")};if(!(o.n||o.m||o.ref||o.st)||!window.QRCode)return;new QRCode(b,{text:JSON.stringify(o),width:220,height:220})}
function save(b,n){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const qimg=()=>$("#qr img")?.src;
async function qsave(){const s=qimg();if(s)save(await(await fetch(s)).blob(),"qr.png")}
async function qshare(){const s=qimg();if(!s)return;const b=await(await fetch(s)).blob(),f=new File([b],"qr.png",{type:"image/png"});if(navigator.canShare?.({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else save(b,"qr.png")}
function scan(){return `<div class="hd"><h2>Scan QR</h2></div><div class="card"><video id="vd" playsinline muted></video><p class="mu" id="sm">Opening camera…</p><div class="f"><span class="lb">Or paste the QR text</span><input id="pt"></div><button class="btn" onclick="ap($('#pt').value)">Use</button><button class="btn o" onclick="go('qrc')">Create QR</button></div>`}
function ap(t){try{const o=JSON.parse(t),F=CF.seminar.fields,Q={},set=(i,v)=>{if(F[i])Q[F[i].k]=v};if(o.f!=="seminar")throw 0;
set(0,o.n||"");set(2,o.ref||"");set(3,F[3]?.o?.includes(o.st)?o.st:"");set(4,o.m||"");go("form",{f:"seminar",pre:Q})}catch(e){const m=$("#sm");if(m)m.textContent="Invalid QR"}}
async function cam(){const m=$("#sm"),v=$("#vd");try{if(!("BarcodeDetector"in window))throw 0;const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}),bd=new BarcodeDetector({formats:["qr_code"]});v.srcObject=s;await v.play();m.textContent="Point the camera at the QR code";
const t=setInterval(async()=>{if(S.v!=="scan"){clearInterval(t);s.getTracks().forEach(x=>x.stop());return}const r=await bd.detect(v).catch(()=>[]);if(r[0]){clearInterval(t);s.getTracks().forEach(x=>x.stop());ap(r[0].rawValue)}},400)}catch(e){v.remove();m.textContent="Camera not available. Paste the QR text below."}}
/* ===== export (Google Sheet se) ===== */
function exp(){const ks=Object.keys(CF||{}),ef=S.ef||ks[0];if(!CF)return `<div class="hd"><h2>Export</h2></div><div class="card"><p class="mu">Connect to the internet once to load the forms.</p></div>`;
return `<div class="hd"><h2>Export data</h2></div><div class="card"><p class="mu">Download entries from the Google Sheet for a date range.</p><div class="chips">${ks.map(k=>`<button class="chb ${k===ef?"on":""}" onclick="S.ef='${k}';draw()" dir="auto">${esc(CF[k].title)}</button>`).join("")}</div>
<div class="f"><span class="lb">Start date</span><input type="date" value="${S.from||""}" onchange="S.from=this.value"></div><div class="f"><span class="lb">End date</span><input type="date" value="${S.to||""}" onchange="S.to=this.value"></div>
<div class="row"><button class="btn" onclick="dl('csv')">Download CSV</button><button class="btn" onclick="dl('xlsx')">Download Excel</button></div><p class="mu" id="em" style="margin-top:10px"></p></div>`}
const em=m=>{const e=$("#em");if(e)e.textContent=m};
async function dl(fmt){const f=S.ef||Object.keys(CF)[0];if(!S.from||!S.to)return em("Please select the start and end date");if(S.from>S.to)return em("Start date must be before the end date");if(!navigator.onLine)return em("Internet is required to download data");
em("Preparing…");const r=await api("export",{f,from:S.from,to:S.to}).catch(()=>null);if(!r||!r.ok)return em(r?.err||"Could not load data");if(!r.rows.length)return em("No entries in this date range");
const all=[r.head,...r.rows],n=`${f}_${S.from}_to_${S.to}`;
if(fmt==="csv")save(new Blob(["\ufeff"+all.map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),n+".csv");
else if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(all),"Data");XLSX.writeFile(wb,n+".xlsx")}else return em("Excel library not loaded. Use CSV or try again.");
em(r.rows.length+" rows downloaded")}
/* ===== admin ===== */
async function loadU(){S.lu=1;try{const r=await api("users");if(r.ok){S.list=r.users}}catch(e){}S.lu=0;if(S.list&&S.v==="admin")draw()}
function admin(){if(!S.list&&!S.lu)loadU();const l=S.list||[],pe=l.filter(x=>x.status==="pending"),ot=l.filter(x=>x.status!=="pending");
const row=x=>`<div class="li"><div><b>${esc(x.name||"—")}</b><br><span class="mu">${esc(x.email)}</span></div><div class="row"><span class="st ${x.status}">${x.status}</span>${x.status!=="approved"?`<button class="sm" onclick="ch('${esc(x.email)}','approved')">Approve</button>`:""}${x.status!=="blocked"?`<button class="sm r" onclick="ch('${esc(x.email)}','blocked')">Block</button>`:""}</div></div>`;
return `<div class="hd"><h2>Admin</h2><button class="ib" onclick="S.list=null;draw()">↻</button></div><div class="card"><h3 style="margin:0">Pending requests (${pe.length})</h3>${pe.map(row).join("")||`<p class="mu">${S.list?"No pending requests":"Loading…"}</p>`}</div><div class="card"><h3 style="margin:0">All users</h3>${ot.map(row).join("")||'<p class="mu">No users yet</p>'}</div>`}
async function ch(e,s){await api("setStatus",{e,s}).catch(()=>{});S.list=null;draw()}
/* ===== session / config ===== */
async function loadCfg(){if(!navigator.onLine||!S.u||S.u.status!=="approved")return;try{const r=await api("config");if(r.ok){CF=r.forms;W("cfg",CF);soft()}}catch(e){}}
async function refresh(){if(!S.u||!navigator.onLine)return;try{const r=await api("me"),was=S.u.status;if(r.ok){S.u={...S.u,...r.u};W("me",S.u);was!==S.u.status?draw():soft();loadCfg()}else if(r.err==="auth")out()}catch(e){}}
addEventListener("online",()=>{soft();sync();loadCfg()});addEventListener("offline",soft);
try{if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(e){}
draw();setTimeout(()=>{S.splash=0;draw()},900);sync();loadCfg();refresh();
</script></body></html>
