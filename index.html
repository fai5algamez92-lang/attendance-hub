if(S.f==="cluster"&&P.leader){const s=f.sections[P.leader];h+=`<div class="cd">${s?s.map(x=>`<label>${x.l}<div>${x.o.map(o=>`<label><input type="checkbox" name="${x.k}" value="${esc(o)}" style="width:auto"> ${esc(o)}</label>`).join("")}</div></label>`).join(""):`<p class="mu">«${esc(P.leader)}» کے سیکشن کے نام فارم سے خود آئیں گے (Apps Script کنیکٹ ہونے پر)۔</p>`}</div>`}
return h+`<button class="btn" style="width:100%">محفوظ کریں</button><p class="er">${esc(S.msg)}</p></form>${back}</div>`}
function sub(ev){ev.preventDefault();const f=new FormData(ev.target),d={};for(const k of new Set([...f.keys()]))d[k]=f.getAll(k).join(", ");
if(S.f==="seminar"&&!/^\d{11}$/.test(d.mob.replace(/\D/g,""))){S.msg="موبائل نمبر 11 ہندسوں کا ہو";draw();return false}
const a=q();a.unshift({id:Date.now().toString(36),f:S.f,d,s:"p",ts:new Date().toLocaleString("en-GB")});W("q",a);go("hist",{msg:"محفوظ ہو گیا"});sync();return false}
function hist(){const a=q();return `<div class="cd"><h3>ہسٹری</h3>${a.length?a.map(x=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd)"><span>${CFG.forms[x.f].title.slice(0,18)}<br><span class="mu">${x.ts}</span></span><span class="st ${x.s==="s"?"s":"p"}">${x.s==="s"?"سنک ہو گیا":"منتظر"}</span></div>`).join(""):`<p class="mu">کوئی اندراج نہیں</p>`}${back}</div>`}
function qrc(){return `<div class="cd"><h3>سیمینار QR بنائیں</h3><label>ریفرنس<input id="qr1" oninput="mk()"></label><label>تربیتی حیثیت<select id="qr2" onchange="mk()"><option value="">—</option>${CFG.forms.seminar.fields[3].o.map(o=>`<option>${o}</option>`).join("")}</select></label>
<p class="mu">نام اور موبائل QR میں نہیں رکھے جاتے۔</p><div id="qr"></div>${back}</div>`}
function mk(){const r=$("#qr1")?.value||"",s=$("#qr2")?.value||"",b=$("#qr");if(!b)return;b.innerHTML="";if(!r&&!s||!window.QRCode)return;new QRCode(b,{text:JSON.stringify({f:"seminar",ref:r,st:s}),width:200,height:200})}
function scan(){return `<div class="cd"><h3>QR اسکین</h3><video id="vd" playsinline muted></video><p class="mu" id="sm">کیمرہ کھل رہا ہے…</p><label>یا QR کا متن یہاں پیسٹ کریں<textarea id="pt" rows="2"></textarea></label><button class="btn g" onclick="ap($('#pt').value)">استعمال کریں</button>${back}</div>`}
function ap(t){try{const o=JSON.parse(t);if(o.f!=="seminar")throw 0;go("form",{f:"seminar",pre:{ref:String(o.ref||""),st:CFG.forms.seminar.fields[3].o.includes(o.st)?o.st:""}})}catch(e){const m=$("#sm");if(m)m.textContent="غلط QR"}}
async function cam(){const m=$("#sm"),v=$("#vd");try{if(!("BarcodeDetector"in window))throw 0;const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}),bd=new BarcodeDetector({formats:["qr_code"]});v.srcObject=s;await v.play();m.textContent="QR کیمرے کے سامنے رکھیں";
const t=setInterval(async()=>{if(S.v!=="scan"){clearInterval(t);s.getTracks().forEach(x=>x.stop());return}const r=await bd.detect(v).catch(()=>[]);if(r[0]){clearInterval(t);s.getTracks().forEach(x=>x.stop());ap(r[0].rawValue)}},400)}catch(e){v.remove();m.textContent="کیمرہ دستیاب نہیں، متن پیسٹ کریں"}}
function admin(){return `<div class="cd"><h3>🛡️ صارفین</h3>${users.filter(x=>x.role!=="admin").map(x=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd)"><span>${esc(x.name)}<br><span class="mu" dir="ltr">${esc(x.email)}</span></span><span class="row"><span class="st ${x.status==="approved"?"s":"p"}">${x.status==="approved"?"منظور":x.status==="blocked"?"بلاک":"منتظر"}</span>${x.status!=="approved"?`<button class="b" onclick="ch('${esc(x.email)}','approved')">✔ منظور</button>`:`<button class="b" onclick="ch('${esc(x.email)}','blocked')">⛔ بلاک</button>`}</span></div>`).join("")||`<p class="mu">کوئی درخواست نہیں</p>`}${back}</div>`}
function ch(e,s){users=users.map(x=>x.email===e?{...x,status:s}:x);W("users",users);draw()}
/* ===== v2: asal backend. CFG.APPS_SCRIPT_URL bharte hi DEMO khud band ho jata hai ===== */
CFG.DEMO=!CFG.APPS_SCRIPT_URL;
const api=async(a,d={})=>(await fetch(CFG.APPS_SCRIPT_URL,{method:"POST",body:JSON.stringify({a,tk:S.u?.tk,...d})})).json();
async function loadCfg(){if(CFG.DEMO)return;const c=L("cfg",null);if(c)CFG.forms=c;if(!navigator.onLine||!S.u)return;try{const r=await api("config");if(r.ok){CFG.forms=r.forms;W("cfg",r.forms);draw()}}catch(e){}}
async function refresh(){if(CFG.DEMO){return go("home")}if(!S.u||!navigator.onLine)return;try{const r=await api("me");if(r.ok){S.u={...S.u,...r.u};W("me",S.u);await loadCfg();draw()}else if(r.err==="auth")out()}catch(e){}}
async function au(ev,reg){if(CFG.DEMO)return au0(ev,reg);ev.preventDefault();const f=new FormData(ev.target);
const r=await api(reg?"register":"login",{e:f.get("e").trim().toLowerCase(),p:f.get("p"),n:f.get("n")}).catch(()=>({err:"نیٹ ورک دستیاب نہیں"}));
if(!r.ok){S.msg=r.err;return draw()}
if(reg){S.v="login";S.msg="درخواست بھیج دی گئی، ایڈمن کی منظوری کا انتظار کریں۔";return draw()}
S.u={...r.u,tk:r.tk};W("me",S.u);await loadCfg();go("home")}
const cap=()=>{const f=document.querySelector("form");if(!f)return;const d=new FormData(f);for(const k of new Set([...d.keys()])){const a=d.getAll(k);S.pre[k]=a.length>1?a:a[0]}};
function fh(d,P){const v=P[d.k]??"";let h=`<label>${d.l}${d.req?" *":""}`;
if(d.t==="multi")h+=`<div>${d.o.map(o=>`<label><input type="checkbox" name="${d.k}" value="${esc(o)}" ${[].concat(v).includes(o)?"checked":""} style="width:auto"> ${esc(o)}</label>`).join("")}</div>`;
else if(d.t==="choice")h+=`<select name="${d.k}" ${d.req?"required":""} ${d.br?'onchange="cap();draw()"':""}><option value="">— منتخب کریں —</option>${d.o.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
else h+=`<input name="${d.k}" ${d.t==="dt"?'type="datetime-local"':d.t==="tel"?'type="tel" inputmode="numeric"':d.t==="date"?'type="date"':""} value="${esc(v)}" ${d.req?"required":""}>`;
return h+"</label>"}
function form(){const f=CFG.forms[S.f],P=S.pre,bf=f.fields.find(x=>x.br),s=bf&&f.sections?.[P[bf.k]];
return `<div class="cd"><h3>${f.title}</h3><form onsubmit="return sub(event)">${f.fields.map(d=>fh(d,P)).join("")}
${bf&&P[bf.k]?`<div class="cd">${s?s.map(d=>fh(d,P)).join(""):`<p class="mu">«${esc(P[bf.k])}» کے سیکشن کے سوال فارم سے خود آئیں گے (Apps Script کنیکٹ ہونے پر)۔</p>`}</div>`:""}
<button class="btn" style="width:100%">محفوظ کریں</button><p class="er">${esc(S.msg)}</p></form>${back}</div>`}
function sub(ev){ev.preventDefault();const f=new FormData(ev.target),d={},F=CFG.forms[S.f];for(const k of new Set([...f.keys()])){const a=f.getAll(k);d[k]=a.length>1?a:a[0]}
const tel=F.fields.find(x=>x.t==="tel");if(tel&&!/^\d{11}$/.test(String(d[tel.k]||"").replace(/\D/g,""))){S.msg="موبائل نمبر 11 ہندسوں کا ہو";draw();return false}
const bf=F.fields.find(x=>x.br),pg=bf&&F.pages?.[d[bf.k]];
const a=q();a.unshift({id:Date.now().toString(36),f:S.f,d,pg,s:"p",ts:new Date().toLocaleString("en-GB")});W("q",a);go("hist");sync();return false}
async function sync(){if(!navigator.onLine)return;let a=q(),ch=0;
for(const it of a.filter(x=>x.s==="p")){try{
if(CFG.DEMO)await new Promise(r=>setTimeout(r,400));
else{const f=CFG.forms[it.f],b=new URLSearchParams(),P=(fd,v,n)=>n.forEach(([k,x])=>b.append(fd.e+"_"+k,x));
for(const fd of [...f.fields,...Object.values(f.sections||{}).flat()]){const v=it.d[fd.k];if(v==null||v==="")continue;
if(fd.t==="dt"){const[d,t]=v.split("T"),[y,m,dd]=d.split("-"),[h,mi]=t.split(":");P(fd,v,[["year",y],["month",m],["day",dd],["hour",h],["minute",mi]])}
else if(fd.t==="date"){const[y,m,dd]=v.split("-");P(fd,v,[["year",y],["month",m],["day",dd]])}
else[].concat(v).forEach(x=>b.append(fd.e,x))}
if(it.pg)b.append("pageHistory","0,"+it.pg);
await fetch(f.action,{method:"POST",mode:"no-cors",body:b})}
it.s="s";ch=1}catch(e){break}}
if(ch){W("q",a);draw()}}
function ap(t){try{const o=JSON.parse(t),F=CFG.forms.seminar.fields;if(o.f!=="seminar")throw 0;go("form",{f:"seminar",pre:{[F[2].k]:String(o.ref||""),[F[3].k]:F[3].o.includes(o.st)?o.st:""}})}catch(e){const m=$("#sm");if(m)m.textContent="غلط QR"}}
async function loadU(){const r=await api("users").catch(()=>({}));if(r.ok){S.list=r.users;draw()}}
function admin(){if(!CFG.DEMO&&!S.list)loadU();const l=CFG.DEMO?users.filter(x=>x.role!=="admin"):(S.list||[]);
return `<div class="cd"><h3>🛡️ صارفین</h3>${l.map(x=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd)"><span>${esc(x.name)}<br><span class="mu" dir="ltr">${esc(x.email)}</span></span><span class="row"><span class="st ${x.status==="approved"?"s":"p"}">${x.status==="approved"?"منظور":x.status==="blocked"?"بلاک":"منتظر"}</span>${x.status!=="approved"?`<button class="b" onclick="ch('${esc(x.email)}','approved')">✔ منظور</button>`:`<button class="b" onclick="ch('${esc(x.email)}','blocked')">⛔ بلاک</button>`}</span></div>`).join("")||`<p class="mu">کوئی درخواست نہیں</p>`}<button class="btn g" onclick="S.list=null;draw()">🔄 تازہ کریں</button>${back}</div>`}
async function ch(e,s){if(CFG.DEMO){users=users.map(x=>x.email===e?{...x,status:s}:x);W("users",users);return draw()}await api("setStatus",{e,s});S.list=null;draw()}
try{if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(e){}
draw();sync();loadCfg();refresh();
</script></body></html>
