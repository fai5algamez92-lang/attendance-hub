<style>
:root{--b:#0a7cff;--b2:#6f42e8;--bg:#f2f4f9;--cd:#fff;--tx:#1b2430;--mu:#7a8594;--in:#eceff4;--er:#d93025;--ok:#18a058;--gr:linear-gradient(120deg,#0a7cff 0%,#6f42e8 60%,#c2399b 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",Roboto,"Noto Nastaliq Urdu",sans-serif;overscroll-behavior-y:contain;user-select:none;-webkit-user-select:none}
input,select{user-select:text;-webkit-user-select:text}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pg{max-width:560px;margin:0 auto;padding:14px 16px 100px;animation:f .25s ease both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sp{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:10px;background:var(--gr);color:#fff}.lg{border-radius:18px}
.bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;background:var(--gr);color:#fff;box-shadow:0 4px 16px #3a2fb033}
.bar .bt{flex:1;min-width:0}.bar h1{font-size:18px;margin:0;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar small{display:block;opacity:.85;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi{border:0;background:#ffffff2b;color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.oc{font-size:11px;padding:3px 10px;border-radius:99px;background:#ffffff2b;white-space:nowrap}.oc:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffc65d;margin-inline-end:5px;vertical-align:1px}.oc.on:before{background:#5dff9b}
.mu{color:var(--mu);font-size:13px;margin:0}.ct{margin:0 0 6px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.btn{flex:1}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--cd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #1b24300d}
button.big{display:flex;gap:14px;align-items:center;width:100%;text-align:start;border:0;font:inherit;color:var(--tx);cursor:pointer}button.big:active{transform:scale(.98)}
.big .tx{flex:1;min-width:0}.big h3{margin:0;font-size:16px}.big p{margin:2px 0 0;color:var(--mu);font-size:13px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0a7cff,#6f42e8);flex:none}.ic.g2{background:linear-gradient(135deg,#ff7a59,#c2399b)}.ic.g3{background:linear-gradient(135deg,#18a058,#0aa5a5)}.ic.g4{background:linear-gradient(135deg,#f5a524,#e5484d)}
.dr{font-size:11px;background:#fff3d6;color:#7a5500;border-radius:99px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px}
.bn{background:#fff3d6;color:#7a5500;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.f{margin-top:12px}.lb{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:0;background:var(--in);color:var(--tx);outline-color:var(--b)}
input.bad{outline:2px solid var(--er);background:#fdecea}.fe{color:var(--er);font-size:12.5px;margin:4px 2px 0}.fe:empty{display:none}
.pw{position:relative}.pw input{padding-inline-end:46px}.eye{position:absolute;inset-inline-end:6px;top:4px;border:0;background:none;color:var(--mu);width:38px;height:38px;display:grid;place-items:center}
.ckg{display:grid;gap:6px}.ck{display:flex;gap:10px;align-items:center;background:var(--in);border-radius:12px;padding:8px 12px}.ck input{width:auto;accent-color:var(--b)}
.sec{margin-top:14px;padding-top:6px;border-top:1px dashed #cfd5df}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;background:var(--b);color:#fff;cursor:pointer;margin-top:14px;width:100%;display:flex;gap:8px;align-items:center;justify-content:center}.btn:disabled{opacity:.7}
.btn.g{background:var(--gr)}.btn.o{background:transparent;color:var(--b);border:1.5px solid var(--b)}.btn.w{background:#fff;color:var(--b)}.btn.r{background:var(--er)}.ok .btn.o{color:#fff;border-color:#fff}
.er{color:var(--er);font-size:13px;margin:8px 0 0}.er:empty{display:none}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.au{max-width:420px;margin:0 auto;padding:40px 24px}.au h1{font-weight:300;font-size:28px;line-height:1.2;margin:18px 0 4px}.au h1 b{display:block;font-weight:700}.bl{color:var(--b);font-size:13px;margin:0 0 6px}
.au a{color:var(--b);cursor:pointer}.c{text-align:center;font-size:13px;color:var(--mu)}.btm{margin-top:40px}
.rm{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}.rm input{width:auto}
.ok{position:fixed;inset:0;padding:70px 28px 100px;background:var(--gr);color:#fff}.ok h1{margin:12px 0 6px}.ok p{opacity:.9}.tick{width:64px;height:64px;border-radius:50%;background:#ffffff30;display:grid;place-items:center;font-size:30px}.ok .col{position:absolute;left:28px;right:28px;bottom:60px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #e3e7ee;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;display:grid;justify-items:center;gap:2px;padding:6px 0;position:relative}
nav button.on{color:var(--b)}nav button.on:before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--gr)}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f4}.li:last-child{border:0}
.st{font-size:12px;border-radius:8px;padding:1px 9px;background:#ffe9bf;color:#7a5500}.st.s,.st.approved{background:#c9f0dc;color:#0b5a32}.st.blocked{background:#fbd4d0;color:#8a1c12}
.sm{border:0;border-radius:9px;background:var(--b);color:#fff;padding:4px 12px;font:inherit;font-size:13px}.sm.r{background:var(--er)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chb{border:1.5px solid var(--in);background:var(--in);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;color:var(--tx);cursor:pointer}.chb.on{background:var(--b);color:#fff;border-color:var(--b)}
#qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:14px;margin-top:12px;min-height:60px}video{width:100%;border-radius:14px;background:#000;max-height:60vh;object-fit:cover}
.res{background:linear-gradient(135deg,#eaf3ff,#f3edff);border-radius:14px;padding:14px;margin-top:12px}.res b{display:block}
/* drawer */
#dw .sh{position:fixed;inset:0;background:#0b102066;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#dw .pn{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:#fff;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;overflow:auto}
#dw.open .sh{opacity:1;pointer-events:auto}#dw.open .pn{transform:none;box-shadow:8px 0 30px #0b102033}
.dh{background:var(--gr);color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 20px 20px}.dh img{border-radius:14px;display:block}.dh b{display:block;font-size:17px;margin-top:12px}.dh span{opacity:.88;font-size:13px;word-break:break-all;display:block}.dh i{font-style:normal;font-size:11px;background:#ffffff33;border-radius:99px;padding:1px 9px;display:inline-block;margin-top:6px}
.dm{padding:8px}.dm button{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;padding:12px 14px;border-radius:12px;font:inherit;color:var(--tx);text-align:start;cursor:pointer}.dm button.on{background:#eef3ff;color:var(--b)}.dm hr{border:0;border-top:1px solid #eef0f4;margin:8px 6px}.dm .r{color:var(--er)}.dv{margin-top:auto;padding:14px 20px;color:var(--mu);font-size:12px}
/* modal + toast */
.ovb{position:fixed;inset:0;background:#0b102080;display:grid;place-items:end center;z-index:30;animation:fi .2s}@keyframes fi{from{opacity:0}}
.mdl{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:su .25s ease}@keyframes su{from{transform:translateY(40px);opacity:.4}}
@media(min-width:600px){.ovb{place-items:center}.mdl{border-radius:22px}}
.mdl h3{margin:0 0 4px;font-size:18px}.mdl .row .btn{margin-top:16px}
.full{position:fixed;inset:0;background:#fff;z-index:31;display:flex;flex-direction:column;animation:fi .2s}.full iframe{flex:1;border:0;width:100%}.full .bar{position:static}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#1b2430;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.bl2{position:relative}.bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#ff3b5c;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px;border:2px solid #fff}
.tg{font-size:11px;border-radius:8px;padding:2px 7px;white-space:nowrap}.tg.y{background:#c9f0dc;color:#0b5a32}.tg.n{background:#fde4e4;color:#8a1c12}
.wk{margin:18px 4px 4px;font-size:12px;font-weight:700;color:var(--b2);text-transform:uppercase;letter-spacing:.3px}
.se{display:flex;gap:12px;align-items:center;padding:12px;margin:8px 0}.sd{width:54px;flex:none;border-radius:14px;background:var(--gr);color:#fff;display:grid;justify-items:center;padding:6px 0;line-height:1.15}.sd b{font-size:20px}.sd small{font-size:11px;opacity:.9}
.si{flex:1;min-width:0}.si p{margin:1px 0;font-size:14px}.sa{display:flex;flex-direction:column;gap:4px}.sa button{border:0;background:var(--in);color:var(--tx);width:34px;height:30px;border-radius:9px;display:grid;place-items:center}.sa button.r{color:var(--er)}.sa svg{width:17px;height:17px}
</style></head><body><div id="app"></div><div id="dw"></div><div id="ov"></div><div id="toast"></div>

const q=()=>L("q",[]),TABS=["home","sch","scan","hist","exp","admin"];
if(!TABS.includes(S.v))S.v="home";
const go=(v,o={})=>{Object.assign(S,{v,msg:""},o);if(v==="sch")sSync();if(TABS.includes(v))W("view",v);if(S.dw)closeDw();draw();scrollTo(0,0)};
const soft=()=>{upChip();if(S.u&&!S.splash&&!S.md&&["home","hist","admin"].includes(S.v))draw()};
const upChip=()=>{const c=$("#oc");if(c){c.className="oc"+(navigator.onLine?" on":"");c.textContent=navigator.onLine?"Online":"Offline"}};
function toast(m,t=2600){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),t)}
const out=()=>{S.u=null;W("me",null);S.v="home";S.list=null;closeMd();if(S.dw)closeDw();draw()};

/* ===== screens ===== */
const TT={home:"Attendance Hub",sch:"Schedule",scan:"Scan QR",hist:"History",exp:"Reports",admin:"Admin",acc:"User access",qrc:"Create QR"};
function draw(){const A=$("#app");if(S.v!=="scan")stopCam();
if(S.splash){A.innerHTML=`<div class="sp"><img src="${LOGO}" width="96" height="96" class="lg" alt=""><h2>Attendance Hub</h2></div>`;return}
if(!S.u){A.innerHTML=auth();return}
if(S.u.status!=="approved"){A.innerHTML=`<div class="au"><img src="${LOGO}" width="64" height="64" class="lg" alt=""><h1>Waiting for <b>approval</b></h1><p class="bl">Your request has been sent to the admin. You can use the app once it is approved.</p><button class="btn" onclick="refresh()">Check again</button><button class="btn o" onclick="out()">Logout</button></div>`;return}
if(((S.v==="admin"||S.v==="acc")&&S.u.role!=="admin")||(S.v==="sch"&&!canS())||(S.v==="exp"&&!canR()))S.v="home";
if((S.v==="form"&&!CF?.[S.f])||(S.v==="qrc"&&!CF?.seminar))S.v="home";
const V={home,form,done,hist,qrc,scan,exp:rep,admin,acc,sch}[S.v]||home,t=TABS.filter(k=>(k!=="admin"||S.u.role==="admin")&&(k!=="sch"||canS())&&(k!=="exp"||canR()));
A.innerHTML=S.v==="done"?V():bar()+`<div class="pg">${V()}</div>`+nav(t);
if(S.v==="qrc")mk();if(S.v==="scan")cam();upBell()}
function bar(){const sb=["form","qrc","acc"].includes(S.v),t=S.v==="form"?CF[S.f].title:TT[S.v],s=S.v==="form"?CF[S.f].sub:"";
return `<header class="bar"><button class="bi" onclick="${sb?(S.v==="acc"?"go('admin')":"go('home')"):"openDw()"}" aria-label="${sb?"Back":"Menu"}">${sb?I.back:I.menu}</button><div class="bt"><h1 dir="auto">${esc(t)}</h1>${s?`<small dir="auto">${esc(s)}</small>`:""}</div><span id="oc" class="oc${navigator.onLine?" on":""}">${navigator.onLine?"Online":"Offline"}</span>${canS()?`<button class="bi bl2" onclick="md({t:'notif'})" aria-label="Notifications">${I.bell}<b id="bdg" class="bdg" hidden>0</b></button>`:""}</header>`}
const NV={home:["Home",I.home],sch:["Schedule",I.cal],scan:["Scan",I.scan],hist:["History",I.clock],exp:["Reports",I.chart],admin:["Admin",I.sh]};
const nav=t=>`<nav>${t.map(k=>`<button class="${S.v===k||(k==="home"&&["form","done","qrc"].includes(S.v))||(k==="admin"&&S.v==="acc")?"on":""}" onclick="go('${k}')">${NV[k][1]}<span>${NV[k][0]}</span></button>`).join("")}</nav>`;

/* ===== drawer (slide menu) ===== */
function openDw(){const u=S.u,t=TABS.filter(k=>(k!=="admin"||u.role==="admin")&&(k!=="sch"||canS())&&(k!=="exp"||canR()));S.dw=1;
$("#dw").innerHTML=`<div class="sh" onclick="closeDw()"></div><aside class="pn"><div class="dh"><img src="${LOGO}" width="56" height="56" alt=""><b dir="auto">${esc(u.name||"User")}</b><span>${esc(u.email)}</span><i>${u.role==="admin"?"Admin":"Member"}</i></div>
<div class="dm">${t.map(k=>`<button class="${S.v===k?"on":""}" onclick="go('${k}')">${NV[k][1]}${NV[k][0]}</button>`).join("")}${canS()?`<button onclick="closeDw();md({t:'notif'})">${I.bell}Schedule status</button>`:""}<hr><button onclick="closeDw();md({t:'pw'})">${I.key}Change password</button><button class="r" onclick="closeDw();md({t:'logout'})">${I.out}Logout</button></div><div class="dv">Attendance Hub v${VER}</div></aside>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>$("#dw").classList.add("open")))}
function closeDw(){S.dw=0;$("#dw").classList.remove("open")}

/* ===== modals ===== */
function md(o){S.md=o;const v=$("#ov");let h="";
if(o.t==="exit")h=`<h3>Exit app?</h3><p class="mu">Do you want to close Attendance Hub?</p><div class="row"><button class="btn o" onclick="closeMd()">Stay</button><button class="btn r" onclick="doExit()">Exit</button></div>`;
else if(o.t==="logout")h=`<h3>Logout?</h3><p class="mu">You will need your email and password to log in again. Unsynced entries stay saved on this phone.</p><div class="row"><button class="btn o" onclick="closeMd()">Cancel</button><button class="btn r" onclick="out()">Logout</button></div>`;
else if(o.t==="pw")h=`<h3>Change password</h3><form onsubmit="return cpw(event)"><div class="f"><span class="lb">Current password</span><input name="op" type="password" required></div><div class="f"><span class="lb">New password (at least 6 characters)</span><input name="np" type="password" minlength="6" required></div><div class="f"><span class="lb">Confirm new password</span><input name="np2" type="password" minlength="6" required></div><p class="er" id="pe"></p><div class="row"><button type="button" class="btn o" onclick="closeMd()">Cancel</button><button class="btn" id="pb">Save</button></div></form>`;
else if(o.t==="notif")h=notifHtml();
else if(o.t==="sform")h=sForm();
else if(o.t==="scopy")h=sCopy();
else if(o.t==="sdel"){const e=LS.find(x=>x.id===o.id);h=`<h3>Delete schedule?</h3><p class="mu" dir="auto">${e?esc(e.leader)+" · "+dLab(e.date)+" · "+esc(e.topic):""}</p><div class="row"><button class="btn o" onclick="closeMd()">Cancel</button><button class="btn r" onclick="sOps([{op:'del',id:'${o.id}'}]);closeMd();toast('Deleted')">Delete</button></div>`}
else if(o.t==="view"){v.innerHTML=`<div class="full"><header class="bar"><button class="bi" onclick="closeMd()" aria-label="Close">${I.x}</button><div class="bt"><h1>Dashboard</h1><small>${esc(S.last?.n||"")}</small></div><button class="bi" onclick="dlLast()" aria-label="Download">${I.dl}</button><button class="bi" onclick="shLast()" aria-label="Share">${I.share}</button></header><iframe id="dfr" title="Dashboard"></iframe></div>`;$("#dfr").srcdoc=S.last.h;return}
v.innerHTML=`<div class="ovb" onclick="if(event.target===this)closeMd()"><div class="mdl">${h}</div></div>`}
function closeMd(){S.md=null;$("#ov").innerHTML=""}
async function cpw(ev){ev.preventDefault();const f=new FormData(ev.target),e=$("#pe"),b=$("#pb");e.textContent="";
if(f.get("np")!==f.get("np2")){e.textContent="New passwords do not match";return false}
if(!navigator.onLine){e.textContent="Internet is required to change the password";return false}
b.disabled=true;b.innerHTML='<span class="spin"></span>';
const r=await api("pw",{op:f.get("op"),np:f.get("np")}).catch(()=>({err:"Could not connect. Please check your internet."}));b.disabled=false;b.textContent="Save";
if(r.ok){closeMd();toast("Password changed")}else{if(r.err==="auth")return out();e.textContent=r.err==="unknown"?"Please deploy the new Code.gs first":r.err||"Could not change password"}return false}

/* ===== back button: kabhi achanak band nahi hoti ===== */
function arm(){if(S.exit||S.hi>=5)return;try{for(let k=S.hi+1;k<=5;k++)history.pushState({i:k},"");S.hi=5}catch(e){}}
addEventListener("click",arm,true);addEventListener("keydown",arm,true);
addEventListener("popstate",e=>{S.hi=e.state?.i??0;if(S.exit)return;
if(S.md){closeMd();return}if(S.dw){closeDw();return}
if(S.u&&S.u.status==="approved"&&!S.splash&&S.v==="acc"){go("admin");return}
if(S.u&&S.u.status==="approved"&&!S.splash&&S.v!=="home"){go("home");return}
if(!S.u&&S.mode==="reg"){S.mode="login";S.msg="";draw();return}
doExit()});
function doExit(){S.exit=1;closeMd();if(S.hi>0)history.go(-S.hi);
setTimeout(()=>{try{history.back()}catch(e){}try{window.close()}catch(e){}setTimeout(()=>{toast("Press back once more to close the app",3800);setTimeout(()=>{S.exit=0},4000)},300)},350)}

/* ===== auth ===== */
function auth(){const r=S.mode==="reg";return `<div class="au"><img src="${LOGO}" width="64" height="64" class="lg" alt=""><h1>${r?"Create <b>your account</b>":"Welcome to <b>Attendance Hub</b>"}</h1><p class="bl">Please enter your details</p>
<form onsubmit="return au(event)">${r?`<div class="f"><span class="lb">Full name</span><input name="n" required value="${esc(S.nm)}"></div>`:""}
<div class="f"><span class="lb">Email</span><input name="e" type="email" autocapitalize="off" required placeholder="Your email" value="${esc(S.em)}"></div>
<div class="f"><span class="lb">Password</span><div class="pw"><input name="p" id="pw" type="password" required placeholder="Your password"><button type="button" class="eye" onclick="eye()">${I.eye}</button></div></div>
${r?"":`<label class="rm"><input type="checkbox" name="r" checked> Remember me</label>`}
<button class="btn">${r?"Create account":"Login"}</button><p class="er">${esc(S.msg)}</p></form>
${r?"":`<p class="c"><a onclick="toast('Please contact the admin to reset your password.')">Forgot your password?</a></p>`}
<p class="c btm">${r?"Already have an account?":"Don't have an account yet?"} <a onclick="S.mode='${r?"login":"reg"}';S.msg='';draw()">${r?"Login":"Create one"}</a></p></div>`}
function eye(){const p=$("#pw"),s=p.type==="password";p.type=s?"text":"password";$(".eye").innerHTML=s?I.eo:I.eye}
async function au(ev){ev.preventDefault();if(S.busy)return;const f=new FormData(ev.target),r=S.mode==="reg",e=f.get("e").trim().toLowerCase();
S.em=e;S.nm=f.get("n")||"";S.busy=1;const b=ev.target.querySelector(".btn");b.disabled=true;b.innerHTML='<span class="spin"></span> Please wait…';
const x=await api(r?"register":"login",{e,p:f.get("p"),n:f.get("n")}).catch(()=>({err:"Could not connect. Please check your internet."}));S.busy=0;
if(!x.ok){S.msg=x.err;return draw()}
if(r){S.mode="login";S.msg="Request sent. You can log in after the admin approves you.";return draw()}
S.u={...x.u,tk:x.tk};W("me",S.u);W("rem",!!f.get("r"));try{sessionStorage.setItem("ses","1")}catch(z){}go("home");loadCfg()}

/* ===== home ===== */
const hasDr=k=>{const d=L("dr_"+k,null);return d&&Object.values(d).some(v=>[].concat(v).some(x=>String(x).trim()))};
function home(){const n=q().filter(x=>x.s==="p").length,G=["","g2","g3"];
return `${n?`<div class="bn"><span>${n} ${n>1?"entries are":"entry is"} waiting to sync</span>${navigator.onLine?`<button class="sm" onclick="sync(1)">Sync now</button>`:""}</div>`:""}
${CF?Object.entries(CF).map(([k,f],i)=>`<button class="card big" onclick="openF('${k}')"><span class="ic ${G[i%3]}">${I.form}</span><span class="tx"><h3 dir="auto">${esc(f.title)}${hasDr(k)?'<span class="dr">Draft</span>':""}</h3><p dir="auto">${esc(f.sub||"Fill and submit")}</p></span></button>`).join(""):`<div class="card"><p class="mu">${navigator.onLine?"Loading forms…":"Connect to the internet once to load the forms."}</p></div>`}

const dLab=s=>{const d=pd(s);return d.getDate()+" "+MO[d.getMonth()]},wLab=m=>dLab(m)+" – "+dLab(addD(m,6))+" "+pd(addD(m,6)).getFullYear();
const t12=t=>{if(!t)return"";let[h,mi]=t.split(":").map(Number);const a=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(mi).padStart(2,"0")+" "+a};
function sApply(list,o){const x=o.it;if(o.op==="add"&&!list.some(e=>e.id===x.id))list.push({...x});else if(o.op==="edit")list=list.map(e=>e.id===x.id?{...e,...x}:e);else if(o.op==="del")list=list.filter(e=>e.id!==o.id);return list}
function sOps(ops){ops.forEach(o=>{SQ.push(o);LS=sApply(LS,o)});W("sq",SQ);W("schl",LS);sRe();sSync()}
function sRe(){upBell();if(S.v==="sch"&&!S.md)draw();if(S.md?.t==="notif")md({t:"notif"})}
async function sSync(){if(!navigator.onLine||ssy||!canS())return;ssy=1;
try{if(SQ.length){const n=SQ.length,r=await api("sSave",{ops:SQ.slice(0,n)});if(r.ok){SQ=SQ.slice(n);LS=r.list;SQ.forEach(o=>LS=sApply(LS,o))}else if(r.err==="auth")return out()}
else{const r=await api("sList");if(r.ok)LS=r.list}W("sq",SQ);W("schl",LS)}catch(e){}ssy=0;sRe()}
const sLeaders=()=>[...new Set([...leaders().map(nm),...LS.map(e=>nm(e.leader))].filter(Boolean))];
function sStat(){const t=ymd(new Date()),w1=mon(t),w2=addD(w1,7),me=ymd(new Date(pd(t).getFullYear(),pd(t).getMonth()+1,0));
const rows=sLeaders().map(n=>{const es=LS.filter(e=>nm(e.leader)===n&&e.date>=w1),has=w=>es.some(e=>e.date>=w&&e.date<=addD(w,6)),last=es.reduce((a,e)=>e.date>a?e.date:a,""),wk=new Set(es.map(e=>mon(e.date))).size;
return{n,a:has(w1),b:has(w2),last,wk,full:!!last&&last>=me}});return{w1,w2,me,rows,pend:rows.filter(r=>!r.a||!r.b)}}
function upBell(){const b=$("#bdg");if(!b)return;const n=canS()?sStat().pend.length:0;b.textContent=n;b.hidden=!n}
function notifHtml(){const s=sStat(),cov=r=>!r.last?"Nothing scheduled yet":`Scheduled till ${dLab(r.last)} · ${r.full?"Full month ✓":r.wk+" week"+(r.wk>1?"s":"")}`;
const row=r=>`<div class="li"><div style="min-width:0"><b dir="auto">${esc(r.n)}</b><br><span class="mu">${cov(r)}</span></div><div class="row" style="flex-wrap:nowrap"><span class="tg ${r.a?"y":"n"}">${r.a?"✓":"✗"} This wk</span><span class="tg ${r.b?"y":"n"}">${r.b?"✓":"✗"} Next wk</span></div></div>`;
return `<h3>Schedule status</h3><p class="mu">This week ${wLab(s.w1)} · Next week ${wLab(s.w2)}</p>${SQ.length?`<div class="bn" style="margin-top:10px">${SQ.length} change${SQ.length>1?"s":""} waiting to sync</div>`:""}
<div style="max-height:56vh;overflow:auto;margin-top:8px"><p class="ct" style="margin-top:8px;color:var(--er)">Pending (${s.pend.length})</p>${s.pend.map(row).join("")||'<p class="mu">Every leader has this week and next week scheduled.</p>'}
<p class="ct" style="margin-top:14px;color:var(--ok)">Done (${s.rows.length-s.pend.length})</p>${s.rows.filter(r=>r.a&&r.b).map(row).join("")||'<p class="mu">None yet</p>'}</div>
<div class="row"><button class="btn o" onclick="closeMd()">Close</button><button class="btn" onclick="closeMd();go('sch')">Open schedule</button></div>`}
const SF=()=>S.sf||(S.sf={ld:"",v:"up"});
function sch(){const f=SF(),t=ymd(new Date()),w1=mon(t);let a=LS.filter(e=>(!f.ld||nm(e.leader)===f.ld)&&(f.v==="all"||(f.v==="up"?e.date>=w1:e.date<w1)));
a.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));if(f.v==="past")a.reverse();const g={};a.forEach(e=>(g[mon(e.date)]=g[mon(e.date)]||[]).push(e));const st=sStat();
return `<div class="row"><button class="btn g" onclick="md({t:'sform'})">${I.plus} New schedule</button><button class="btn o" onclick="sXlsx()">${I.dl} Excel</button></div>
${st.pend.length?`<button class="card big" onclick="md({t:'notif'})" style="background:#fff5f4"><span class="ic g4">${I.bell}</span><span class="tx"><h3>${st.pend.length} leader${st.pend.length>1?"s":""} pending</h3><p>Tap to see who has not scheduled this or next week</p></span></button>`:""}
${SQ.length?`<div class="bn" style="margin-top:12px"><span>${SQ.length} change${SQ.length>1?"s":""} waiting to sync</span>${navigator.onLine?`<button class="sm" onclick="sSync()">Sync now</button>`:""}</div>`:""}
<div class="card" style="padding:12px 14px"><select onchange="SF().ld=this.value;draw()" dir="auto"><option value="">All leaders</option>${sLeaders().map(n=>`<option value="${esc(n)}" ${n===f.ld?"selected":""}>${esc(n)}</option>`).join("")}</select>
<div class="chips">${[["up","Upcoming"],["past","Past"],["all","All"]].map(([k,l])=>`<button class="chb ${f.v===k?"on":""}" onclick="SF().v='${k}';draw()">${l}</button>`).join("")}</div></div>
${Object.keys(g).map(w=>`<p class="wk">${w===w1?"This week · ":w===addD(w1,7)?"Next week · ":""}${wLab(w)}</p>${g[w].map(e=>`<div class="card se"><div class="sd"><small>${DY[pd(e.date).getDay()]}</small><b>${pd(e.date).getDate()}</b><small>${MO[pd(e.date).getMonth()]}</small></div>
<div class="si"><b dir="auto">${esc(e.leader)}</b><p dir="auto">${esc(e.topic||"—")}</p><span class="mu" dir="auto">${t12(e.time)} · ${esc(e.loc||"—")}</span></div>
<div class="sa"><button onclick="md({t:'sform',id:'${e.id}'})" aria-label="Edit">${I.edit}</button><button onclick="md({t:'scopy',id:'${e.id}'})" aria-label="Copy">${I.copy}</button><button class="r" onclick="md({t:'sdel',id:'${e.id}'})" aria-label="Delete">${I.trash}</button></div></div>`).join("")}`).join("")||`<div class="card"><p class="mu">${navigator.onLine||LS.length?"No schedule here yet. Tap New schedule.":"Connect to the internet once to load the schedule."}</p></div>`}`}
/* modal parts */
const dlist=()=>`<div class="chips" id="dl">${(S.md.ds||[]).map((d,i)=>`<span class="chb on" onclick="S.md.ds.splice(${i},1);$('#dlw').outerHTML=dWrap()">${DY[pd(d).getDay()]} ${dLab(d)} ✕</span>`).join("")}</div>`;
const dWrap=()=>`<div id="dlw">${dlist()}</div>`;
function rpt(){const m=S.md.rp||"one";return `<div class="f"><span class="lb">${S.md.t==="scopy"?"Copy to":"Repeat"}</span><div class="chips">${(S.md.t==="scopy"?[["wk","Every week until"],["pick","Pick dates"]]:[["one","Only this date"],["wk","Every week until"],["pick","Pick more dates"]]).map(([k,l])=>`<button type="button" class="chb ${m===k?"on":""}" onclick="sKeep();S.md.rp='${k}';md(S.md)">${l}</button>`).join("")}</div>
${m==="wk"?`<div class="f"><input type="date" id="ru" value="${S.md.ru||""}" onchange="S.md.ru=this.value"></div>`:""}${m==="pick"?`<div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="date" id="pk"><button type="button" class="sm" style="padding:10px 14px" onclick="const v=$('#pk').value;if(v&&!S.md.ds.includes(v)){S.md.ds.push(v);S.md.ds.sort();$('#dlw').outerHTML=dWrap()}">Add</button></div>${dWrap()}`:""}</div>`}
function sKeep(){const f=$("#sfm");if(!f)return;const d=new FormData(f);S.md.v={date:d.get("date"),time:d.get("time"),leader:d.get("leader"),topic:d.get("topic"),loc:d.get("loc")}}
function sForm(){const o=S.md,e=o.id?LS.find(x=>x.id===o.id):null,v=o.v||e||{date:ymd(new Date()),time:"",leader:"",topic:"",loc:""};o.ds=o.ds||[];
return `<h3>${e?"Edit schedule":"New schedule"}</h3><form id="sfm" onsubmit="return sSave(event)"><div class="row2"><div class="f"><span class="lb">Date *</span><input type="date" name="date" required value="${esc(v.date)}"></div><div class="f"><span class="lb">Time *</span><input type="time" name="time" required value="${esc(v.time)}"></div></div>
<div class="f"><span class="lb">Leader name *</span><select name="leader" required dir="auto"><option value="">Select…</option>${sLeaders().map(n=>`<option ${n===nm(v.leader)?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
<div class="f"><span class="lb">Topic *</span><input name="topic" dir="auto" required value="${esc(v.topic)}"></div><div class="f"><span class="lb">Location *</span><input name="loc" dir="auto" required value="${esc(v.loc)}"></div>
${e?"":rpt()}<p class="er" id="se"></p><div class="row"><button type="button" class="btn o" onclick="closeMd()">Cancel</button><button class="btn">Save</button></div></form>`}
function dates(start){const o=S.md;if(o.rp==="wk"){if(!o.ru)return{err:"Choose the 'until' date"};if(o.ru<=start)return{err:"'Until' date must be after "+dLab(start)};const a=[];for(let d=addD(start,7);d<=o.ru&&a.length<60;d=addD(d,7))a.push(d);return{a}}
if(o.rp==="pick"){if(!o.ds.length)return{err:"Add at least one date"};return{a:o.ds.filter(d=>d!==start)}}return{a:[]}}
function sSave(ev){ev.preventDefault();sKeep();const o=S.md,v=o.v,er=$("#se");for(const k of["topic","loc"])v[k]=v[k].trim();
if(o.id){sOps([{op:"edit",it:{id:o.id,...v}}]);closeMd();toast("Schedule updated");return false}
const r=dates(v.date);if(r.err){er.textContent=r.err;return false}
const all=[v.date,...r.a],dup=all.filter(d=>LS.some(e=>e.date===d&&nm(e.leader)===nm(v.leader)));
sOps(all.map(d=>({op:"add",it:{id:sId(),...v,date:d}})));closeMd();toast(all.length>1?all.length+" meetings scheduled":"Schedule saved");if(dup.length)setTimeout(()=>toast("Note: this leader already had a meeting on "+dup.map(dLab).join(", "),4000),2700);return false}
function sCopy(){const o=S.md,e=LS.find(x=>x.id===o.id);if(!e)return"";o.ds=o.ds||[];o.rp=o.rp||"wk";
return `<h3>Copy schedule</h3><div class="res" style="margin-top:6px"><b dir="auto">${esc(e.leader)}</b><span class="mu" dir="auto">${DY[pd(e.date).getDay()]} ${dLab(e.date)} · ${t12(e.time)} · ${esc(e.topic)} · ${esc(e.loc)}</span></div>${rpt()}<p class="mu" style="margin-top:8px">Copies keep the same time, topic and location. You can edit each one after.</p><p class="er" id="se"></p>
<div class="row"><button class="btn o" onclick="closeMd()">Cancel</button><button class="btn" onclick="sDoCopy()">${I.copy} Create copies</button></div>`}
function sDoCopy(){const e=LS.find(x=>x.id===S.md.id),r=dates(e.date);if(r.err){$("#se").textContent=r.err;return}if(!r.a.length){$("#se").textContent="No new dates selected";return}
sOps(r.a.map(d=>({op:"add",it:{id:sId(),date:d,time:e.time,leader:e.leader,topic:e.topic,loc:e.loc}})));closeMd();toast(r.a.length+" cop"+(r.a.length>1?"ies":"y")+" created — tap ✎ to change the topic")}
function sXlsx(){if(!window.XLSX)return toast("Excel library not loaded. Open the app once with internet.");const f=SF(),t=ymd(new Date()),w1=mon(t);
const a=LS.filter(e=>(!f.ld||nm(e.leader)===f.ld)&&(f.v==="all"||(f.v==="up"?e.date>=w1:e.date<w1))).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));if(!a.length)return toast("Nothing to download for this filter");
const H=["Date","Day","Time","Leader","Topic","Location"],rows=[["Tehsil Schedule"],["Leader",f.ld||"All leaders","","Printed",new Date().toLocaleString("en-GB")],[],H];let w="";
a.forEach(e=>{const m=mon(e.date);if(m!==w){w=m;rows.push(["Week: "+wLab(m)])}rows.push([fmtD(e.date),DY[pd(e.date).getDay()],t12(e.time),e.leader,e.topic,e.loc])});
const wb=XLSX.utils.book_new();addSh(wb,rows,"Schedule",new Set());const u=new Set(["schedule"]);if(!f.ld)sLeaders().forEach(n=>{const b=a.filter(e=>nm(e.leader)===n);if(b.length)addSh(wb,[[n],[],H,...b.map(e=>[fmtD(e.date),DY[pd(e.date).getDay()],t12(e.time),e.leader,e.topic,e.loc])],n,u)});
const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});S.last={b:new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),n:`Tehsil_Schedule_${t}.xlsx`};save(S.last.b,S.last.n);toast("Downloaded "+S.last.n)}

/* ===== admin ===== */
async function loadU(){S.lu=1;try{const r=await api("users");if(r.ok){S.list=r.users}}catch(e){}S.lu=0;if(S.list&&(S.v==="admin"||S.v==="acc")&&!S.md)draw()}
function admin(){if(!S.list&&!S.lu)loadU();const l=S.list||[],pe=l.filter(x=>x.status==="pending"),ot=l.filter(x=>x.status!=="pending");
const row=x=>`<div class="li"><div><b dir="auto">${esc(x.name||"—")}</b><br><span class="mu">${esc(x.email)}</span></div><div class="row"><span class="st ${x.status}">${x.status}</span>${x.status!=="approved"?`<button class="sm" onclick="ch('${esc(x.email)}','approved')">Approve</button>`:""}${x.status!=="blocked"?`<button class="sm r" onclick="ch('${esc(x.email)}','blocked')">Block</button>`:""}</div></div>`;
return `<div class="row" style="justify-content:flex-end"><button class="sm" onclick="S.list=null;draw()">${I.sync}</button></div><button class="card big" onclick="go('acc')"><span class="ic g3">${I.sh}</span><span class="tx"><h3>User access</h3><p>Choose who can see Reports and Schedule</p></span></button>${lenCard()}<div class="card"><h3 class="ct">Pending requests (${pe.length})</h3>${pe.map(row).join("")||`<p class="mu">${S.list?"No pending requests":"Loading…"}</p>`}</div><div class="card"><h3 class="ct">All users</h3>${ot.map(row).join("")||'<p class="mu">No users yet</p>'}</div>`}
function lenCard(){const ns=[...new Set([...leaders().map(nm),...Object.keys(LEN)].filter(Boolean))],ms=lenMiss();
return `<div class="card"><h3 class="ct">Leader names (for reports)</h3><p class="mu">Write each leader's name exactly as it is typed in the حاضر / غیر حاضر lists, so his own name counts as "Leader". New leaders from the form appear here automatically.</p>${ms.length?`<div class="bn" style="margin-top:10px">${ms.length} new leader${ms.length>1?"s":""} need an English name</div>`:""}
<form onsubmit="return saveLen(event)">${ns.map((n,i)=>`<div class="f"><span class="lb" dir="auto">${esc(n)}${LEN[n]?"":' <b style="color:var(--er)">· New</b>'}${leaders().map(nm).includes(n)?"":" · not in form now"}</span><input name="l${i}" data-u="${esc(n)}" value="${esc(LEN[n]||"")}" placeholder="English name, e.g. Shadab Ahmed" autocapitalize="words"></div>`).join("")||'<p class="mu">No leaders found in the form.</p>'}<button class="btn" id="lb">Save leader names</button></form></div>`}
async function saveLen(ev){ev.preventDefault();if(!navigator.onLine){toast("Internet is required to save");return false}const m={};ev.target.querySelectorAll("input[data-u]").forEach(i=>{if(i.value.trim())m[i.dataset.u]=i.value.trim()});const b=$("#lb");b.disabled=true;b.innerHTML='<span class="spin"></span>';
const r=await api("setLen",{len:m}).catch(()=>({}));b.disabled=false;b.textContent="Save leader names";if(r.ok){LEN=r.len;W("len",LEN);toast("Leader names saved");draw()}else toast(r.err==="unknown"?"Please deploy the new Code.gs first":"Could not save");return false}
function acc(){if(!S.list&&!S.lu)loadU();const l=(S.list||[]).filter(x=>x.status==="approved"),nr=l.filter(x=>x.rep).length,ns=l.filter(x=>x.sched).length;
return `<p class="mu" style="margin:4px 2px 0">Tap a button to allow or remove access. Reports are hidden from everyone who is not allowed.</p><div class="row" style="margin:8px 0"><span class="st approved">Reports: ${nr}</span><span class="st approved">Schedule: ${ns}</span><button class="sm" style="margin-left:auto" onclick="S.list=null;draw()">${I.sync}</button></div>
${l.map(x=>`<div class="card"><b dir="auto" style="font-size:17px">${esc(x.name||"—")}</b><br><span class="mu">${esc(x.email)}</span><div class="row" style="margin-top:6px"><button class="btn ${x.rep?"g":"o"}" style="padding:16px 10px" onclick="chR('${esc(x.email)}',${!x.rep})">${I.chart} Reports ${x.rep?"✓ Allowed":"— Not allowed"}</button><button class="btn ${x.sched?"g":"o"}" style="padding:16px 10px" onclick="chS('${esc(x.email)}',${!x.sched})">${I.cal} Schedule ${x.sched?"✓ Allowed":"— Not allowed"}</button></div></div>`).join("")||`<div class="card"><p class="mu">${S.list?"No approved users yet":"Loading…"}</p></div>`}`}
async function chR(e,on){const r=await api("setRep",{e,on}).catch(()=>({}));if(!r.ok)toast(r.err==="unknown"?"Please deploy the new Code.gs first":"Could not update");else toast(on?"Reports access given":"Reports access removed");S.list=null;draw()}
async function ch(e,s){await api("setStatus",{e,s}).catch(()=>{});S.list=null;draw()}
async function chS(e,on){const r=await api("setSched",{e,on}).catch(()=>({}));if(!r.ok)toast(r.err==="unknown"?"Please deploy the new Code.gs first":"Could not update");else toast(on?"Schedule permission given":"Schedule permission removed");S.list=null;draw()}

/* ===== session / config ===== */
async function loadCfg(){if(!navigator.onLine||!S.u||S.u.status!=="approved")return;try{const r=await api("config");if(r.ok){CF=r.forms;W("cfg",CF);if(r.len){LEN=r.len;W("len",LEN)}soft()}}catch(e){}}
async function refresh(){if(!S.u||!navigator.onLine)return;try{const r=await api("me"),was=S.u.status;if(r.ok){S.u={...S.u,...r.u};W("me",S.u);was!==S.u.status?draw():soft();loadCfg();sSync()}else if(r.err==="auth")out()}catch(e){}}
addEventListener("online",()=>{soft();sync();loadCfg();sSync()});addEventListener("offline",soft);
try{history.replaceState({i:0},"")}catch(e){}
try{if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js")}catch(e){}
draw();setTimeout(()=>{S.splash=0;draw()},900);sync();loadCfg();refresh();
</script></body></html>
