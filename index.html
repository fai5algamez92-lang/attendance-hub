/* ===== Navy + Teal business theme: restrained glassmorphism ===== */
:root{--b:#17324D;--b2:#17324D;--bg:#F3F7F9;--cd:rgba(255,255,255,.90);--tx:#202B35;--mu:#687987;--in:#E8F0F3;--ln:rgba(23,50,77,.10);--gr:#287C7C;--tint:#E6F0F2;--sh:0 3px 14px rgba(23,50,77,.055)}

.ck{background:rgba(255,255,255,.9);box-shadow:var(--sh);border-radius:11px}

 --b:#102D46;--b2:#102D46;--gr:#159B91;--bg:#071B2B;
