const XLSRC="\"\"\"Cluster Attendance Dashboard (Excel).  CSV from the Google Form  ->  Excel dashboard workbook.\nRun:  python app.py [file.csv]     (no argument = a file picker window opens)\nOptional files next to the EXE or next to the CSV:\n   leaders.csv      Urdu leader name,English name\n   name_fixes.csv   wrong spelling,correct spelling\n\"\"\"\nimport csv, os, re, sys, datetime as dt\n\nDEFAULT_LEADERS = {'\u0641\u06cc\u0635\u0644 \u062c\u0644\u06cc\u0644': 'Faisal Jalil', '\u0627\u06a9\u0631\u0645 \u062c\u0627\u0648\u06cc\u062f': 'Akram Javed', '\u0634\u0627\u062f\u0627\u0628 \u0627\u062d\u0645\u062f': 'Shadab Ahmed',\n                   '\u0645\u0637\u0627\u06c1\u0631 \u0639\u0631\u0641\u0627\u0646': 'Mutahir Irfan', '\u0622\u0641\u062a\u0627\u0628 \u0627\u062d\u0645\u062f': 'Aftab Ahmed'}\nDEFAULT_FIXES = {'rahan': 'Rehan'}\n\nclass ENMap(dict):\n    def __missing__(self, k): return k\n\ndef base_dir():\n    return os.path.dirname(sys.executable) if getattr(sys, 'frozen', False) else os.path.dirname(os.path.abspath(__file__))\n\ndef read_pairs(path):\n    out = {}\n    if os.path.exists(path):\n        with open(path, encoding='utf-8-sig', newline='') as f:\n            for row in csv.reader(f):\n                if len(row) >= 2 and row[0].strip(): out[row[0].strip()] = row[1].strip()\n    return out\n\ndef parse_dt(s):\n    s = (s or '').strip()\n    if not s: return None\n    for fmt in ('%m/%d/%Y %H:%M:%S', '%m/%d/%Y %H:%M', '%d/%m/%Y %H:%M:%S', '%Y-%m-%d %H:%M:%S', '%Y-%m-%d %H:%M'):\n        try: return dt.datetime.strptime(s, fmt)\n        except ValueError: pass\n    return None\n\ndef split_names(s):\n    out = []\n    for p in re.split(r'[,&\u060c]', s or ''):\n        p = re.sub(r'\\s+', ' ', p).strip()\n        if p: out.append(p)\n    return out\n\ndef parse_csv(path):\n    warnings = []\n    EN = ENMap(DEFAULT_LEADERS); fixes = dict(DEFAULT_FIXES)\n    for folder in {base_dir(), os.path.dirname(os.path.abspath(path))}:\n        EN.update(read_pairs(os.path.join(folder, 'leaders.csv')))\n        fixes.update({k.lower(): v for k, v in read_pairs(os.path.join(folder, 'name_fixes.csv')).items()})\n    with open(path, encoding='utf-8-sig', newline='') as f: table = list(csv.reader(f))\n    if len(table) < 2: raise ValueError('The CSV has no data rows')\n    header, data = table[0], table[1:]\n    ncol = len(header)\n    pairs = [(i, i + 1) for i in range(3, ncol - 1, 2)]\n    meetings = []\n    for ln, v in enumerate(data, 2):\n        v = v + [''] * (ncol - len(v))\n        ts, md, leader = parse_dt(v[0]), parse_dt(v[1]), v[2].strip()\n        if not (md or ts) or not leader:\n            warnings.append('Row %d skipped (no date or no leader)' % ln); continue\n        P, A = [], []\n        for pi, ai in pairs: P += split_names(v[pi]); A += split_names(v[ai])\n        meetings.append(dict(ts=ts or md, md=md, leader=leader, P=P, A=A))\n    meetings.sort(key=lambda m: (m['md'] or m['ts'], m['ts']))\n    rows = []\n    for mid, m in enumerate(meetings, 1):\n        m['id'] = mid\n        def std(n):\n            k = fixes.get(n.lower())\n            return (k, 'Name standardised: %s -> %s' % (n, k)) if k else (n, '')\n        plist = [(n,) + std(n) for n in m['P']]; alist = [(n,) + std(n) for n in m['A']]\n        done = set()\n        for o, s_, nt in plist:\n            if s_.lower() in done: continue\n            done.add(s_.lower())\n            both = any(s_.lower() == x[1].lower() for x in alist)\n            rows.append([mid, s_, o, 'Present', (nt + '; ' if nt else '') + ('Listed in both lists - counted Present' if both else '')])\n        for o, s_, nt in alist:\n            if s_.lower() in done: continue\n            done.add(s_.lower())\n            rows.append([mid, s_, o, 'Absent', nt])\n        if m['leader'] not in EN and ('Leader \"%s\"' % m['leader']) not in ' '.join(warnings):\n            warnings.append('Leader \"%s\" has no English name. Add a line to leaders.csv:  %s,English Name' % (m['leader'], m['leader']))\n    for k, v in fixes.items():\n        n = sum(1 for r in rows if r[2].lower() == k)\n        if n: warnings.append('Name fixed: %s -> %s (%dx)' % (k, v, n))\n    return meetings, rows, EN, header, data, warnings\n\n\nfrom openpyxl import Workbook\nfrom openpyxl.styles import Font,PatternFill,Alignment,Border,Side\nfrom openpyxl.utils import get_column_letter as L\nfrom openpyxl.worksheet.datavalidation import DataValidation\nfrom openpyxl.workbook.defined_name import DefinedName\nfrom openpyxl.formatting.rule import CellIsRule,FormulaRule,DataBarRule\nfrom openpyxl.chart import BarChart,LineChart,Reference\nfrom openpyxl.chart.label import DataLabelList\nfrom collections import Counter,OrderedDict\n\nimport os\nTEAL='0F4C5C';ORG='E36414';LIGHT='EAF2F1';INK='1B2B34';GREY='6B7C85';WHITE='FFFFFF';GOLD='F4B942'\nFN='Arial'\ndef font(sz=10,b=False,c=INK,i=False): return Font(name=FN,size=sz,bold=b,color=c,italic=i)\ndef fill(c): return PatternFill('solid',start_color=c,end_color=c)\nthin=Side(style='thin',color='C9D6D4'); BOX=Border(left=thin,right=thin,top=thin,bottom=thin)\nCEN=Alignment(horizontal='center',vertical='center',wrap_text=True)\nLEFT=Alignment(horizontal='left',vertical='center',wrap_text=True)\n\n\n\ndef build_workbook(meetings,rows,EN,raw_header,raw_rows,out,PERSON=None,MONTH=None):\n    leaders=sorted(set(m['leader'] for m in meetings),key=lambda x:EN[x])\n    mdt=lambda m:m['md'] or m['ts']\n    months=[]; weeks=[]\n    for m in meetings:\n        d=mdt(m); mo=d.strftime('%b %Y')\n        if mo not in months: months.append(mo)\n        ws_=(d-dt.timedelta(days=d.weekday())); wl='Wk '+ws_.strftime('%d %b %y')\n        if wl not in weeks: weeks.append(wl)\n    nM=len(meetings)\n    # roles\n    cnt=Counter(); \n    mleader={m['id']:m['leader'] for m in meetings}\n    stat=Counter()\n    for mid,s,o,st,nt in rows: stat[(mleader[mid],s,st)]+=1\n    people=OrderedDict()\n    for mid,s,o,st,nt in rows: people[(mleader[mid],s)]=1\n    roster=[]\n    for (ld,s) in people:\n        p=stat[(ld,s,'Present')]; a=stat[(ld,s,'Absent')]\n        if s.lower()==EN[ld].lower(): role,why='Leader','Is the cluster leader'\n        elif a>=1: role,why='Member','Listed in the absent list (absent list = actual members)'\n        elif p>=2: role,why='Member','Present in 2 or more meetings of this leader'\n        else: role,why='New Friend','Appeared once, only as present (extra attendee)'\n        roster.append((ld,s,role,why))\n    order={'Leader':0,'Member':1,'New Friend':2}\n    roster.sort(key=lambda r:(EN[r[0]],order[r[2]],r[1].lower()))\n    nfcount=sum(1 for r_ in roster if r_[2]=='New Friend')\n    allpeople=sorted(set(s for _,s in people),key=str.lower)\n    if not PERSON: PERSON=EN[leaders[0]] if EN[leaders[0]] in allpeople else allpeople[0]\n    if not MONTH: MONTH=months[-1]\n\n    wb=Workbook()\n    wsD=wb.active; wsD.title='Dashboard'\n    wsP=wb.create_sheet('Person_Report'); wsT=wb.create_sheet('Leader Trends'); wsA=wb.create_sheet('Attendees')\n    wsM=wb.create_sheet('Meetings'); wsL=wb.create_sheet('Attendance'); wsR=wb.create_sheet('Roster')\n    wsS=wb.create_sheet('Lists'); wsRaw=wb.create_sheet('Raw_CSV'); wsC=wb.create_sheet('Report_Calc'); wsG=wb.create_sheet('Guide')\n    for w in wb.worksheets:\n        w.sheet_properties.tabColor=TEAL if w.title in('Dashboard','Leader Trends','Attendees','Person_Report') else ('9AA9AE' if w.title!='Guide' else ORG)\n\n    MEND=max(200,len(meetings)+100); AEND=max(2000,len(rows)+500); REND=max(300,len(roster)+100)\n    def hdr(ws,r,c,t,w=None,color=TEAL):\n        x=ws.cell(r,c,t); x.font=font(10,True,WHITE); x.fill=fill(color); x.alignment=CEN; x.border=BOX\n        if w: ws.column_dimensions[L(c)].width=w\n    def title(ws,t,sub=None):\n        ws['A1']=t; ws['A1'].font=font(15,True,TEAL)\n        if sub: ws['A2']=sub; ws['A2'].font=font(9,False,GREY,True)\n    INP=Font(name=FN,size=10,color='0000FF')\n    def DL(pos=None):\n        d=DataLabelList(); d.showVal=True; d.showSerName=False; d.showCatName=False; d.showLegendKey=False; d.showPercent=False\n        if pos: d.position=pos\n        return d\n\n    # ---------- Lists ----------\n    ws=wsS; title(ws,'Lists & Settings','Dropdown sources and settings used by the dashboard. Blue = editable input.')\n    for c,t,w in [(1,'Leaders',18),(3,'Months',14),(5,'Weeks',16),(7,'Attendees',22),(9,'Setting',44),(10,'Value',16),(12,'Leader (as entered)',20),(13,'English name (assumed)',24)]: hdr(ws,4,c,t,w)\n    ws['A5']='All'; ws['C5']='All'; ws['E5']='All'\n    for i,l in enumerate(leaders): ws.cell(6+i,1,l)\n    for i,m in enumerate(months): ws.cell(6+i,3,m)\n    for i,w_ in enumerate(weeks): ws.cell(6+i,5,w_)\n    for i,p in enumerate(allpeople): ws.cell(5+i,7,p)\n    for i,l in enumerate(leaders): ws.cell(5+i,12,l); ws.cell(5+i,13,EN[l]).font=INP\n    ws['I5']='Min. meetings (listed) to call someone a consistent absentee'; ws['J5']=2; ws['J5'].font=INP; ws['J5'].fill=fill('FFF4CC')\n    ws['I6']='Criteria - leader (auto)'; ws['J6']='=IF(selLeader=\"All\",\"*\",selLeader)'\n    ws['I7']='Criteria - month (auto)'; ws['J7']='=IF(selMonth=\"All\",\"*\",selMonth)'\n    ws['I8']='Criteria - week (auto)'; ws['J8']='=IF(selWeek=\"All\",\"*\",selWeek)'\n    for r in range(5,9): ws.cell(r,9).font=font(10)\n    for rr in ws['A5:M60']:\n        for c in rr:\n            if c.value is not None and c.font.color is None or (c.value is not None and c.font.name!=FN): c.font=font(10)\n    def dn(name,ref): wb.defined_names[name]=DefinedName(name,attr_text=ref)\n    dn('selLeader','Dashboard!$B$5'); dn('selMonth','Dashboard!$F$5'); dn('selWeek','Dashboard!$I$5'); dn('selPerson','Dashboard!$M$5')\n    dn('critLeader','Lists!$J$6'); dn('critMonth','Lists!$J$7'); dn('critWeek','Lists!$J$8'); dn('minMeet','Lists!$J$5')\n\n    # ---------- Raw ----------\n    ws=wsRaw; title(ws,'Raw CSV (exactly as exported from the form)','Reference copy. Not used by formulas.')\n    for j,c in enumerate(raw_header,1): hdr(ws,4,j,c,24,GREY)\n    for i,r in enumerate(raw_rows):\n        for j,v in enumerate(r,1): ws.cell(5+i,j,v).font=font(9)\n\n    # ---------- Meetings ----------\n    ws=wsM; title(ws,'Meetings - one row per meeting','Blue = typed from the form. Meeting date is taken from the form field; if it is empty, the form Timestamp is used.')\n    H=['Meeting ID','Cluster Leader','Form Timestamp','Meeting Date-Time (form)','Final Date-Time','Meeting Date','Day','Month','Week','Date Source','Seq (per leader)','Key','Members Present','Members Absent','New Friends Present','Members Expected','Total Present','Attendance %','Flag','Match','Rank','Report Key']\n    W=[9,16,19,21,19,13,7,11,14,11,9,16,10,10,10,10,10,11,26,7,7,16]\n    for j,(h,w) in enumerate(zip(H,W),1): hdr(ws,4,j,h,w)\n    ws.row_dimensions[4].height=32\n    A_=lambda c:f\"Attendance!${c}$5:${c}${AEND}\"\n    for k,m in enumerate(meetings):\n        r=5+k\n        ws.cell(r,1,m['id']); ws.cell(r,2,m['leader']); \n        c=ws.cell(r,3,m['ts']); c.number_format='dd-mmm-yyyy hh:mm'\n        c=ws.cell(r,4,m['md']); c.number_format='dd-mmm-yyyy hh:mm'\n        for j in (1,2,3,4): ws.cell(r,j).font=INP\n        f={5:f'=IF(D{r}=\"\",C{r},D{r})',6:f'=INT(E{r})',7:f'=TEXT(F{r},\"ddd\")',8:f'=TEXT(F{r},\"mmm yyyy\")',\n           9:f'=\"Wk \"&TEXT(F{r}-WEEKDAY(F{r},2)+1,\"dd mmm yy\")',10:f'=IF(D{r}=\"\",\"Timestamp\",\"Form date\")',\n           11:f'=COUNTIFS($B$5:B{r},B{r})',12:f'=B{r}&\"|\"&K{r}',\n           13:f'=COUNTIFS({A_(\"A\")},A{r},{A_(\"H\")},\"Present\",{A_(\"I\")},\"<>New Friend\")',\n           14:f'=COUNTIFS({A_(\"A\")},A{r},{A_(\"H\")},\"Absent\",{A_(\"I\")},\"<>New Friend\")',\n           15:f'=COUNTIFS({A_(\"A\")},A{r},{A_(\"H\")},\"Present\",{A_(\"I\")},\"New Friend\")',\n           16:f'=M{r}+N{r}',17:f'=M{r}+O{r}',18:f'=IF(P{r}=0,0,M{r}/P{r})',\n           19:f'=IF(COUNTIFS({A_(\"A\")},A{r},{A_(\"K\")},\"*both lists*\")>0,\"Name in both lists - counted Present\",\"\")',\n           20:f'=IF(AND(OR(selLeader=\"All\",B{r}=selLeader),OR(selMonth=\"All\",H{r}=selMonth),OR(selWeek=\"All\",I{r}=selWeek)),1,0)',\n           21:f'=IF(T{r}=1,SUM($T$5:T{r}),\"\")',\n           22:f'=IF(repMonth=\"All\",B{r}&\"|\"&K{r},IF(H{r}=repMonth,B{r}&\"|\"&COUNTIFS($B$5:B{r},B{r},$H$5:H{r},H{r}),\"\"))'}\n        for j,v in f.items(): ws.cell(r,j,v)\n        ws.cell(r,5).number_format='dd-mmm-yyyy hh:mm'; ws.cell(r,6).number_format='dd-mmm-yyyy'; ws.cell(r,18).number_format='0%'\n        for j in range(1,23):\n            c=ws.cell(r,j); c.border=BOX\n            if c.font.color is None or c.font.color.rgb!='000000FF': c.font=font(10)\n    ws.freeze_panes='C5'\n    MR=lambda c:f\"Meetings!${c}$5:${c}${MEND}\"\n\n    # ---------- Roster ----------\n    ws=wsR; title(ws,'Roster - role of every person per leader','Role decides who counts in Attendance %. Leader/Member count; New Friend = extra attendee (shown separately). Edit blue Role cells to override.')\n    for j,(h,w) in enumerate(zip(['Key','Cluster Leader','Person','Times Listed','Role (editable)','Why (auto rule)','Role Key'],[28,18,24,11,16,56,26]),1): hdr(ws,4,j,h,w)\n    for k,(ld,s,role,why) in enumerate(roster):\n        r=5+k\n        ws.cell(r,1,f'=B{r}&\"|\"&C{r}'); ws.cell(r,2,ld); ws.cell(r,3,s)\n        ws.cell(r,4,f'=COUNTIFS({A_(\"J\")},A{r})'); ws.cell(r,5,role).font=INP; ws.cell(r,6,why); ws.cell(r,7,f'=C{r}&\"|\"&E{r}')\n        for j in range(1,8):\n            c=ws.cell(r,j); c.border=BOX\n            if j!=5: c.font=font(10)\n    dv=DataValidation(type='list',formula1='\"Leader,Member,New Friend\"',allow_blank=False); ws.add_data_validation(dv); dv.add(f'E5:E{4+len(roster)}')\n    ws.freeze_panes='A5'; ws.auto_filter.ref=f'A4:G{4+len(roster)}'\n\n    # ---------- Attendance ----------\n    ws=wsL; title(ws,'Attendance - one row per person per meeting (long format)','Names split from the comma-separated form cells. Same name in both lists = counted Present.')\n    H=['Meeting ID','Cluster Leader','Meeting Date','Month','Week','Person','Name as entered','Status','Role','Key','Note','Hit (drill-down)','Rank','Hit (report)','Rank (report)']\n    W=[9,16,13,11,14,22,22,10,10,30,36,10,8,10,10]\n    for j,(h,w) in enumerate(zip(H,W),1): hdr(ws,4,j,h,w)\n    mi=lambda col:f'INDEX({MR(col)},MATCH($A{{r}},{MR(\"A\")},0))'\n    for k,(mid,s,o,st,nt) in enumerate(rows):\n        r=5+k\n        ws.cell(r,1,mid).font=INP; ws.cell(r,6,s).font=INP; ws.cell(r,7,o).font=INP; ws.cell(r,8,st).font=INP; ws.cell(r,11,nt).font=font(9)\n        ws.cell(r,2,'='+mi('B').format(r=r)); ws.cell(r,3,'='+mi('F').format(r=r)); ws.cell(r,4,'='+mi('H').format(r=r)); ws.cell(r,5,'='+mi('I').format(r=r))\n        ws.cell(r,9,f'=IFERROR(INDEX(Roster!$E$5:$E${REND},MATCH(B{r}&\"|\"&F{r},Roster!$A$5:$A${REND},0)),\"New Friend\")')\n        ws.cell(r,10,f'=B{r}&\"|\"&F{r}')\n        ws.cell(r,12,f'=IF(AND(F{r}=selPerson,OR(selMonth=\"All\",D{r}=selMonth),OR(selWeek=\"All\",E{r}=selWeek)),1,0)')\n        ws.cell(r,13,f'=IF(L{r}=1,SUM($L$5:L{r}),\"\")')\n        ws.cell(r,14,f'=IF(AND(F{r}=repPerson,OR(repMonth=\"All\",D{r}=repMonth)),1,0)')\n        ws.cell(r,15,f'=IF(N{r}=1,SUM($N$5:N{r}),\"\")')\n        ws.cell(r,3).number_format='dd-mmm-yyyy'\n        for j in range(1,16):\n            c=ws.cell(r,j); c.border=BOX\n            if c.font.name!=FN or c.font.color is None: c.font=font(10)\n    ws.freeze_panes='A5'; ws.auto_filter.ref=f'A4:O{4+len(rows)}'\n    ws.conditional_formatting.add(f'H5:H{4+len(rows)}',CellIsRule(operator='equal',formula=['\"Absent\"'],font=Font(name=FN,color='C0392B',bold=True)))\n    ws.conditional_formatting.add(f'H5:H{4+len(rows)}',CellIsRule(operator='equal',formula=['\"Present\"'],font=Font(name=FN,color='1E8449',bold=True)))\n\n    # ---------- Attendees ----------\n    ws=wsA; title(ws,'Attendees - person-wise attendance','Columns D-G follow the Month and Week selected on the Dashboard. Use the header filter on Leader to print leader-wise. New Friends are shown but are not counted in cluster %.')\n    nr=len(roster)\n    base=['Cluster Leader','Person','Role','Meetings Listed','Present','Absent','Attendance %','Status','In leader filter','Flag','Rank','New Friend flag','NF rank']\n    bw=[16,22,10,10,9,9,11,22,8,7,7,8,7]\n    for j,(h,w) in enumerate(zip(base,bw),1): hdr(ws,4,j,h,w)\n    mcol0=len(base)+1\n    for mi_,mo in enumerate(months):\n        c0=mcol0+mi_*3\n        ws.cell(3,c0,'=Lists!$C$%d'%(6+mi_)).font=font(10,True,TEAL)\n        for t,j in zip(['Listed','Present','Att %'],range(3)): hdr(ws,4,c0+j,f'{mo} {t}',10,ORG)\n    cm=mcol0+len(months)*3\n    hdr(ws,4,cm,'Months consistently absent',14,ORG)\n    ws.row_dimensions[4].height=34\n    for k in range(nr):\n        r=5+k; rr=5+k\n        ws.cell(r,1,f'=Roster!B{rr}'); ws.cell(r,2,f'=Roster!C{rr}'); ws.cell(r,3,f'=Roster!E{rr}')\n        key=f'Roster!A{rr}'\n        ws.cell(r,5,f'=COUNTIFS({A_(\"J\")},{key},{A_(\"H\")},\"Present\",{A_(\"D\")},critMonth,{A_(\"E\")},critWeek)')\n        ws.cell(r,6,f'=COUNTIFS({A_(\"J\")},{key},{A_(\"H\")},\"Absent\",{A_(\"D\")},critMonth,{A_(\"E\")},critWeek)')\n        ws.cell(r,4,f'=E{r}+F{r}')\n        ws.cell(r,7,f'=IF(D{r}=0,\"\",E{r}/D{r})'); ws.cell(r,7).number_format='0%'\n        ws.cell(r,8,f'=IF(AND(C{r}<>\"New Friend\",D{r}>=minMeet,E{r}=0),\"CONSISTENT ABSENTEE\",IF(C{r}=\"New Friend\",\"New Friend (extra)\",\"\"))')\n        ws.cell(r,9,f'=IF(OR(selLeader=\"All\",A{r}=selLeader),1,0)')\n        ws.cell(r,10,f'=IF(AND(LEFT(H{r},4)=\"CONS\",I{r}=1),1,0)')\n        ws.cell(r,11,f'=IF(J{r}=1,SUM($J$5:J{r}),\"\")')\n        ws.cell(r,12,f'=IF(AND(C{r}=\"New Friend\",I{r}=1,D{r}>0),1,0)')\n        ws.cell(r,13,f'=IF(L{r}=1,SUM($L$5:L{r}),\"\")')\n        parts=[]\n        for mi_,mo in enumerate(months):\n            c0=mcol0+mi_*3; hc=f'{L(c0)}$3'\n            ws.cell(r,c0,f'=COUNTIFS({A_(\"J\")},{key},{A_(\"D\")},{hc},{A_(\"H\")},\"Present\")+COUNTIFS({A_(\"J\")},{key},{A_(\"D\")},{hc},{A_(\"H\")},\"Absen ns',12,ORG),\n    ('New Friend = an extra attendee who is not a member of that cluster (listed once, only as present). New Friends are never counted in Attendance %; their names are listed separately.',10,INK),\n    ('Pattern labels: Consistent absentee = never present (listed in at least N meetings). Attended then stopped = present before, then absent in the last 2 listed meetings. On & off = present/absent switching at least twice. Missed latest meeting = absent only in the newest one. Returned / improving = was absent, now present.',10,INK),\n    ('Avg present / absent per meeting = total member attendances divided by the number of meetings (so the figures stay the size of one group, not a running total).',10,INK),\n    ('Meeting date = the \"kis tarikh aur time par meeting hui\" field. If it is empty, the form Timestamp is used (Date Source column on Meetings shows which).',10,INK),\n    ('Month = month of the meeting date. Week = Monday-start week of the meeting date.',10,INK),\n    ('Members = the cluster leader + people who appear in that leader\\'s absent lists (the absent list is the actual member list) + people present in 2 or more of his meetings. Everyone else who only appears once as present is a New Friend (extra attendee).',10,INK),\n    ('Attendance % = Members present / (Members present + Members absent). New Friends are counted separately and never raise or lower the %. You can change any role on the Roster sheet.',10,INK),\n    ('If a name is in both the present and absent list of one meeting, it is counted as Present (Note column flags it).',10,INK),\n    ('Consistent absentee = a Member who was listed in at least N meetings (N = Lists!J5, default 2) in the selected period and was never present. Select a month on the Dashboard to see month-wise; the Attendees sheet also shows months consistently absent.',10,INK),\n    ('Assumptions to confirm',12,ORG),\n    ('Leader English names come from leaders.csv (next to the EXE). They are used only to recognise the leader inside the present list. Wrong spellings can be fixed in name_fixes.csv; the original spelling is kept in the Attendance sheet (Name as entered).',10,INK),\n    ('Adding new data',12,ORG),\n    ('This workbook was generated from the CSV by the EXE. For new data, run the EXE again with the new CSV - it rebuilds everything (all sheets, formulas and charts).',10,INK)]\n    for i,(t,sz,c) in enumerate(G,1):\n        ws.cell(i,2,t).font=font(sz,sz>=12,c); ws.cell(i,2).alignment=Alignment(wrap_text=True,vertical='top')\n        if sz==10: ws.row_dimensions[i].height=30 if len(t)>115 else 18\n        if sz==10 and len(t)>240: ws.row_dimensions[i].height=44\n    ws.sheet_view.showGridLines=False\n    for w in (wsM,wsL,wsR,wsA,wsS):\n        w.page_setup.orientation='landscape'; w.page_setup.fitToWidth=1; w.page_setup.fitToHeight=0; w.sheet_properties.pageSetUpPr.fitToPage=True\n    wsA.print_title_rows='4:4'\n    wb.save(out)\n    return out\n\n\ndef main():\n    path = sys.argv[1] if len(sys.argv) > 1 else None\n    gui = None\n    if not path:\n        import tkinter as tk\n        from tkinter import filedialog, messagebox\n        root = tk.Tk(); root.withdraw(); gui = messagebox\n        path = filedialog.askopenfilename(title='Select the Cluster Report CSV', filetypes=[('CSV files', '*.csv'), ('All files', '*.*')])\n        if not path: return\n    try:\n        meetings, rows, EN, header, data, warnings = parse_csv(path)\n        out = os.path.join(os.path.dirname(os.path.abspath(path)), 'Cluster_Dashboard_%s.xlsx' % dt.datetime.now().strftime('%Y%m%d_%H%M'))\n        build_workbook(meetings, rows, EN, header, data, out)\n    except Exception as e:\n        import traceback\n        if gui: gui.showerror('Cluster Dashboard', 'Could not build the dashboard:\\n%s' % e)\n        else: traceback.print_exc()\n        return\n    msg = 'Meetings: %d   Leaders: %d\\nSaved:\\n%s\\n\\nIf Excel opens it in Protected View, click \"Enable Editing\" so the dashbo /* ===== dashboard (standalone HTML, offline) ===== */
const DCSS=`:root{--b:#2457A6;--bt:#EAF1FC;--tx:#1D2B3F;--mu:#56667A;--bg:#F4F7FB;--ln:#DCE4EE;--ok:#1E7A4C;--wa:#9A6700;--er:#B3261E}*{box-sizing:border-box}

.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.k{background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--ln);border-top:4px solid var(--c,#2457A6)}.k{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);cursor:pointer;position:relative}.k:active{background:var(--bt)}.k span{color:var(--mu);font-size:13px;font-weight:600;display:block}.k b{display:block;font-size:30px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.k:after{content:"i";position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;border:1.5px solid #B7CBE8;color:var(--b);font:700 11px/15px Georgia,serif;text-align:center}
#tip{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);max-width:min(92vw,520px);background:#1D2B3F;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s;z-index:20}#tip.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

#q{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid #C9D5E3;font-weight:400}
@media(max-width:640px){.top{padding:18px 14px 60px}.top h1{font-size:19px}.wr{padding:0 10px 40px}
.kp{grid-template-columns:1fr 1fr;gap:10px}.k{padding:12px}.k b{font-size:24px}.k:last-child{grid-column:1/-1}
